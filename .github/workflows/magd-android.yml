name: MAGD Android

on:
  push:
    branches:
      - master
    paths:
      - "engine/**"
      - "common/**"
      - "filesystem/**"
      - "public/**"
      - "3rdparty/mainui/**"
      - "3rdparty/mbedtls/**"
      - "3rdparty/extras/**"
      - "android/**"
      - "scripts/configure-ninja.py"
      - "scripts/build-ninja.py"
      - "scripts/gha/deps_android.sh"
      - "scripts/gha/build_android.sh"
      - "wscript"
      - ".github/workflows/magd-android.yml"

  pull_request:
    paths:
      - "engine/**"
      - "common/**"
      - "filesystem/**"
      - "public/**"
      - "3rdparty/mainui/**"
      - "3rdparty/mbedtls/**"
      - "3rdparty/extras/**"
      - "android/**"
      - "scripts/configure-ninja.py"
      - "scripts/build-ninja.py"
      - "scripts/gha/deps_android.sh"
      - "scripts/gha/build_android.sh"
      - "wscript"
      - ".github/workflows/magd-android.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magd-android-${{ github.ref }}
  cancel-in-progress: true

env:
  SDL_VERSION: 2.32.10
  FFMPEG_VERSION: 8.1
  YY_THUNKS_VERSION: v1.2.1

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Android dependencies
        run: bash scripts/gha/deps_android.sh

      - name: Verify release signing secrets
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          MY_KEYSTORE_JKS: ${{ secrets.MY_KEYSTORE_JKS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          test -n "$MY_KEYSTORE_JKS"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          echo "Android signing secrets are configured."

      - name: Build Android APK
        env:
          MY_KEYSTORE_JKS: ${{ secrets.MY_KEYSTORE_JKS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash scripts/gha/build_android.sh

      - name: Verify APK
        shell: bash
        run: |
          set -e

          test -s artifacts/xash3d-fwgs-android.apk

          echo "Android APK:"
          ls -lh artifacts/xash3d-fwgs-android.apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: magd-android
          path: artifacts/*
          if-no-files-found: error