name: MAGD Server CI

on:
  push:
    paths:
      - 'xash-server/**'
      - '.github/workflows/magd-server.yml'
  pull_request:
    paths:
      - 'xash-server/**'
      - '.github/workflows/magd-server.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xash-server
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: xash-server/package.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run

  deploy:
    name: Manual production deploy
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/New'
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xash-server
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
